services:
  db:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bus_booking}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-bus_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: dependencies
    image: bus-booking-api:migrations
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER:-bus_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-bus_booking}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  api:
    build: .
    image: ${API_IMAGE:-bus-booking-api:local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${APP_DB_USER:-bus_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-bus_booking}?schema=public
    command: sh -c "npm run db:seed && node src/server.js"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose: ["3000"]
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  nginx:
    image: nginx:1.30.6-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks: [backend]

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: bus-booking-api:test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://${APP_DB_USER:-bus_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-bus_booking}_test?schema=public
      TEST_DATABASE_URL: postgresql://${APP_DB_USER:-bus_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-bus_booking}_test?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
